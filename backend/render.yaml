services:
  - type: web
    name: paintmatch-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn paintmatch.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: paintmatch.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: paintmatch-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://paintmatch.vercel.app"

databases:
  - name: paintmatch-db
    databaseName: paintmatch
    user: paintmatch
