<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaintMatch</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #334155; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .header { background: linear-gradient(135deg, #f97316, #ea580c); padding: 32px 40px; text-align: center; }
    .header h1 { color: #fff; margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .header p { color: rgba(255,255,255,0.85); margin: 6px 0 0; font-size: 14px; }
    .body { padding: 40px; }
    .body h2 { color: #0f172a; font-size: 20px; margin: 0 0 16px; }
    .body p { color: #475569; line-height: 1.6; margin: 0 0 12px; }
    .card { background: #f8fafc; border-radius: 12px; padding: 20px; margin: 20px 0; border-left: 4px solid #f97316; }
    .card p { margin: 4px 0; font-size: 14px; }
    .card strong { color: #0f172a; }
    .btn { display: inline-block; background: #f97316; color: #fff !important; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 15px; margin: 20px 0; }
    .btn:hover { background: #ea580c; }
    .footer { background: #f1f5f9; padding: 24px 40px; text-align: center; }
    .footer p { color: #94a3b8; font-size: 12px; margin: 0; }
    .stars { color: #f59e0b; font-size: 24px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎨 PaintMatch</h1>
      <p>Plateforme de mise en relation clients & peintres</p>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>© 2026 PaintMatch — Cameroun</p>
      <p style="margin-top:8px;">Vous recevez cet email car vous êtes inscrit sur PaintMatch.</p>
    </div>
  </div>
</body>
</html>
